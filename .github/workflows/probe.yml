# 임시: Actions 러너 IP 에서 API 들이 막히는지 확인. Task 7 에서 지운다.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/probe.js
